<div class="item-report-container">
  <div class="report-header">
    <div class="title-section">

      <div class="title-icon">
        <mat-icon>shopping_cart</mat-icon>
      </div>

      <div>
        <h1>Item List</h1>
        <p>View and manage Items information</p>
      </div>
    </div>

    <div class="actions-bar">
      <button mat-raised-button class="print-btn" (click)="printReport()">
        <mat-icon>print</mat-icon>
        Print Report
      </button>
    </div>
  </div>

  <div class="toolbar">
    <button
      mat-icon-button class="refresh-btn" (click)="refreshData()" matTooltip="Refresh">
      <mat-icon>refresh</mat-icon>
    </button>


    <mat-form-field appearance="outline" class="search-box">

      <mat-icon matPrefix class="search-icon">
        search
      </mat-icon>

      <input
        matInput
        placeholder="Search Item by No. , Item Name..."
        (keyup)="applyFilter($event)">
    </mat-form-field>
  </div>


  <div class="table-card">
    <table mat-table [dataSource]="dataSource" matSort class="item-table">

      
      <ng-container matColumnDef="itemNo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Item No </th>
        <td mat-cell *matCellDef="let element"> {{element.itemNo}} </td>
      </ng-container>
    
      <ng-container matColumnDef="itemName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Item Name </th>
        <td mat-cell *matCellDef="let element"> {{element.itemName}} </td>
      </ng-container>
    
      <ng-container matColumnDef="itemCategory">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Item Category </th>
        <td mat-cell *matCellDef="let element"> {{element.itemCategory}} </td>
      </ng-container>


      <!-- HEADER / ROW -->
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="appointment-row">
      </tr>

    </table>

  </div>


  <!-- ================= PAGINATOR ================= -->
  <mat-paginator
    [pageSizeOptions]="[5, 10, 25, 100]"
    aria-label="Select page of appointments">
  </mat-paginator>


  <div class="report-footer">
  <div class="item-count">
      <mat-icon>groups</mat-icon>
      Total Items:
      <strong>{{dataSource?.filteredData.length}}</strong>
  </div>
  <div class="generated-date">
      <mat-icon>event</mat-icon>
      Generated on {{getDate()}}
  </div>
  </div>

</div>
