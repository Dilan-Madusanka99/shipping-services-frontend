<div class="employee-report-container">
  <div class="report-header">
      <div class="title-section">
          <div class="title-icon">
              <mat-icon>assessment</mat-icon>
          </div>
          <div>
              <h1>Employee List</h1>
              <p>View and manage employee information</p>
          </div>
      </div>
      <button mat-raised-button color="primary" class="print-btn" (click)="printReport()">
          <mat-icon>print</mat-icon>
          Print Report
      </button>
</div>

  <div class="table-section">
    <div class="refresh-filter-section">
      <div class="toolbar">
          <button mat-mini-fab color="primary" class="refresh-btn" (click)="refreshData()">
              <mat-icon>refresh</mat-icon>
          </button>

          <mat-form-field appearance="outline" class="search-box">
              <mat-icon matPrefix class="search-icon"> search </mat-icon>
              <input matInput placeholder="Search employee by Name, NIC or Role..." (keyup)="applyFilter($event)">
          </mat-form-field>
      </div>
    </div>

    <div class="table-card">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="empNo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Employee No</th>
          <td mat-cell *matCellDef="let element">{{ element.empNo }}</td>
        </ng-container>

        <ng-container matColumnDef="firstName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
          <td mat-cell *matCellDef="let element">{{ element.firstName }}</td>
        </ng-container>

        <ng-container matColumnDef="nic">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>NIC</th>
          <td mat-cell *matCellDef="let element">{{ element.nic }}</td>
        </ng-container>

        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
          <td mat-cell *matCellDef="let element">{{ element.roles }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>

  <div class="report-footer">
  <div class="employee-count">
      <mat-icon>groups</mat-icon>
      Total Employees:
      <strong>{{dataSource?.filteredData.length}}</strong>
  </div>
  <div class="generated-date">
      <mat-icon>event</mat-icon>
      Generated on {{getDate()}}
  </div>
  </div>
</div>
