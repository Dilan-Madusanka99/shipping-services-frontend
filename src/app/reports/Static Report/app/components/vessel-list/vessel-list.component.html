<div class="vessel-report-container">
  <div class="report-header">
    <h1>Vessel Report</h1>
  </div>

  <div class="actions-bar">
    <button class="print-button" (click)="printReport()">
      <span class="print-icon"></span>
      Print Report
    </button>
  </div>

  <div class="table-section">
    <div class="refresh-filter-section">
      <div class="refresh-button">
        <button mat-raised-button color="primary" (click)="refreshData()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
      <mat-form-field class="filter">
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input />
      </mat-form-field>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="imoNo">
        <th mat-header-cell *matHeaderCellDef> IMO No </th>
          <td mat-cell *matCellDef="let element"> {{element.imoNo}} </td>

      </ng-container>
      <ng-container matColumnDef="vesselName">
        <th mat-header-cell *matHeaderCellDef> Vessel Name </th>
          <td mat-cell *matCellDef="let element"> {{element.vesselName}} </td>
      </ng-container>

      <ng-container matColumnDef="vesselType">
        <th mat-header-cell *matHeaderCellDef> Vessel Type </th>
          <td mat-cell *matCellDef="let element"> {{element.vesselType}} </td>
      </ng-container>

      <ng-container matColumnDef="flag">
        <th mat-header-cell *matHeaderCellDef> Flag </th>
          <td mat-cell *matCellDef="let element"> {{element.flag}} </td>
      </ng-container>

      <ng-container matColumnDef="yob">
        <th mat-header-cell *matHeaderCellDef> Build </th>
          <td mat-cell *matCellDef="let element"> {{element.yob}} </td>
      </ng-container>

      <ng-container matColumnDef="grt">
        <th mat-header-cell *matHeaderCellDef> GRT </th>
          <td mat-cell *matCellDef="let element"> {{element.grt}} </td>
      </ng-container>

      <ng-container matColumnDef="bhp">
        <th mat-header-cell *matHeaderCellDef> BHP </th>
          <td mat-cell *matCellDef="let element"> {{element.bhp}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>

  <div class="report-footer">
    <p>Generated on {{ getDate() }}</p>
  </div>
</div>
