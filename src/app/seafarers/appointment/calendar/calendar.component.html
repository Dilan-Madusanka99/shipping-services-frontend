<div class="calendar-wrapper">

  <!-- Navigation bar -->
  <div class="cal-nav">
    <div class="nav-left">
      <button class="nav-btn" (click)="prevMonth()" aria-label="Previous month">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="10,3 5,8 10,13"/>
        </svg>
      </button>
      <button class="nav-btn today-btn" (click)="goToday()" [class.active]="isCurrentMonth()">Today</button>
      <button class="nav-btn" (click)="nextMonth()" aria-label="Next month">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6,3 11,8 6,13"/>
        </svg>
      </button>
    </div>
    <div class="month-label">
      <span class="month-badge">
        {{ monthLabel() }}
      </span>
    </div>
    <div class="nav-right">
      <!-- Placeholder for future view switcher -->
      <span class="view-label">Month</span>
    </div>
  </div>

  <!-- Weekday headers -->
  <div class="day-headers">

    <div
      class="day-header"
      *ngFor="let day of weekDays; let i = index"
      [class.weekend-header]="i === 0 || i === 6"
    >
      <span class="day-header-text">
        {{ day }}
      </span>
    </div>

  </div>

  <!-- Calendar grid -->
<div class="cal-grid">

  <!-- 6 weeks -->
  <div
    class="week-row"
    *ngFor="let week of calendarMonth().weeks; trackBy: trackByWeek"
  >

  <!-- 7 days -->
  <div
    class="day-cell"
    *ngFor="let day of week; trackBy: trackByDate"

    [class.disabled-day]="isDisabled(day)"
    [class.weekend]="isWeekend(day.date)"
    [class.fully-booked]="isFullyBooked(day)"

    (click)="onDayClick(day)"

    [attr.aria-label]="day.dateStr"

    [title]="getDayTooltip(day)"
  >

    <!-- Day number -->
    <div class="day-num-wrap">

      <span
        class="day-num"
        [class.today-badge]="day.isToday"
      >
        {{ day.day }}
      </span>

    </div>

    <!-- Fully booked -->
    <div
      class="status-label"
      *ngIf="isFullyBooked(day)"
    >
      Full
    </div>

    <!-- Booked appointments -->
    <div
      class="events-area"
      *ngIf="
        day.appointments &&
        day.appointments.length > 0
      "
    >
      <!-- Only show first 2 -->
      <div
        *ngFor="
          let appt of getVisibleAppointments(day.appointments);
          trackBy: trackById
        "
        class="time-slot"
        (click)="onAppointmentClick(appt, $event)"
      >

        <span class="time-dot"></span>

        <span class="time-text">
          {{ formatTime(appt.time) }}
        </span>

      </div>

      <!-- Show remaining count -->
      <div
        *ngIf="
          getOverflowCount(day.appointments) > 0
        "
        class="overflow-label"
        (click)="$event.stopPropagation()"
      >
        +{{ getOverflowCount(day.appointments) }} more
      </div>

    </div>

  </div>
  </div>
</div>
</div>
