<div class="container">
  <div class="form-header">
    <h1>Seafarer Details Form</h1>
    <mat-form-field class="example-full-width">
      <mat-label>SID No</mat-label>
      <mat-select [(ngModel)]="selectedSeafarers" formControlName="sidNo" (valueChange)="onSeafarersSelect($event)">
        <mat-form-field class="w-100">
          <input matInput placeholder="Search for Seafarers..." (keyup)="onKey($event.target)" />
        </mat-form-field>
        <mat-option *ngFor="let seafarers of seafarersDropdown" [value]="seafarers.id">{{ seafarers.sidNo }}</mat-option>
      </mat-select>
    </mat-form-field>
    <div class="refresh-button">
      <button mat-raised-button color="primary" (click)="refreshData()">
        <mat-icon>refresh</mat-icon>
      </button>
    </div>
    <button type="button" class="download-btn" (click)="downloadPDF()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7,10 12,15 17,10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Download PDF
    </button>
  </div>

  <form [formGroup]="userForm" class="form-container" id="formToPrint">
    <!-- Personal Details Section -->
    <div class="form-section">
      <div class="section-header">
        <h2>Personal Details</h2>
      </div>
      <div class="section-content">
        <div class="form-row">
          <div class="form-field">
            <label for="position">Position</label>
            <input type="text" id="position" formControlName="position" />
          </div>
          <div class="form-field">
            <label for="appliedDate">Applied Date</label>
            <input type="text" id="appliedDate" formControlName="appliedDate" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="availableDate">Available Date</label>
            <input type="text" id="availableDate" formControlName="availableDate" />
          </div>
          <div class="form-field">
            <label for="surname">Surname</label>
            <input type="text" id="surname" formControlName="surname" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="otherNames">Other Names</label>
            <input type="text" id="otherNames" formControlName="otherNames" />
          </div>
          <div class="form-field">
            <label for="dob">Date of Birth</label>
            <input type="text" id="dob" formControlName="dob" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="birthPlace">Birth Place</label>
            <input type="text" id="birthPlace" formControlName="birthPlace" />
          </div>
          <div class="form-field">
            <label for="nic">NIC</label>
            <input type="text" id="nic" formControlName="nic" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="religion">Religion</label>
            <input type="text" id="religion" formControlName="religion" />
          </div>
          <div class="form-field">
            <label for="gender">Gender</label>
            <input type="text" id="gender" formControlName="gender" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="marriedStatus">Married Status</label>
            <input type="text" id="marriedStatus" formControlName="marriedStatus" />
          </div>
          <div class="form-field">
            <label for="noOfChildren">No of Children</label>
            <input type="text" id="noOfChildren" formControlName="noOfChildren" />
          </div>
        </div>
      </div>
    </div>

    <!-- Document Details Section -->
    <div class="form-section">
      <div class="section-header">
        <h2>Contact Details</h2>
      </div>
      <div class="section-content">
        <div class="form-row">
          <div class="form-field">
            <label for="address">Address</label>
            <input type="text" id="address" formControlName="address" />
          </div>
          <div class="form-field">
            <label for="home">Home</label>
            <input type="text" id="home" formControlName="home" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="mobile">Mobile</label>
            <input type="text" id="mobile" formControlName="mobile" />
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="text" id="email" formControlName="email" />
          </div>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-header">
        <h2>Next of Kin Details</h2>
      </div>
      <div class="section-content">
        <div class="form-row">
          <div class="form-field">
            <label for="kinName">Kin Name</label>
            <input type="text" id="kinName" formControlName="kinName" />
          </div>
          <div class="form-field">
            <label for="kinRelationship">Kin Relationship</label>
            <input type="text" id="kinRelationship" formControlName="kinRelationship" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="kinAddress">Kin Address</label>
            <input type="text" id="kinAddress" formControlName="kinAddress" />
          </div>
          <div class="form-field">
            <label for="kinMobile">Kin Mobile</label>
            <input type="text" id="kinMobile" formControlName="kinMobile" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="kinEmail">Kin Email</label>
            <input type="text" id="kinEmail" formControlName="kinEmail" />
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
