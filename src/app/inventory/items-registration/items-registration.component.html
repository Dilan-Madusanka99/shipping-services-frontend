<div class="container">
  <div class="form-section">
    <form [formGroup]="itemsRegistrationForm" class="itemsRegistrationForm" (ngSubmit)="onSubmit()">

      <mat-form-field class="example-full-width">
        <mat-label>Item No.</mat-label>
        <input matInput placeholder="Item No." formControlName="itemNo" >
      </mat-form-field>
      <br>

      <mat-form-field class="example-full-width">
          <mat-label>IMPA No</mat-label>
          <input matInput placeholder="IMPA (Optional)" formControlName="emNo">
        </mat-form-field>
        <br>

        <mat-form-field class="example-full-width">
          <mat-label>Item Name</mat-label>
          <input matInput placeholder="Item Name" formControlName="itemName">
        </mat-form-field>
        <br>

        <mat-form-field class="example-full-width">
          <mat-label>Item Category</mat-label>
          <mat-select [(value)]="selected" formControlName="itemCategory">
            <mat-option value="Deck Stores">Deck Stores</mat-option>
            <mat-option value="Engine Stores">Engine Stores</mat-option>
            <mat-option value="Food Items">Food Items</mat-option>
            <mat-option value="Other">Other</mat-option>
          </mat-select>
        </mat-form-field>
        <br>
        
        <div class="form-field">
            <label for="image">Upload Item Image</label>
            <input type="file" (change)="onFileSelected($event)" accept="image/*"/>
        </div>
        
        <div *ngIf="previewUrl">
            <p>Image Preview:</p>
            <img [src]="previewUrl" alt="Image preview" width="200" />
        </div>
        <br><br>

        <button type="submit" mat-raised-button color="primary" class="form-button" [disabled]="isButtonDisabled" > {{saveButtonLabel}} </button>
        <button type="reset" mat-raised-button color="secondary" class="form-button" (click)="resetData()" > Reset </button>
      
    </form>
    
  </div>
  <div class="table-section">
    <div class="refresh-filter-section">
      <div class="refresh-button">
        <button mat-raised-button color="primary" (click)="refreshData()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
      <mat-form-field class="filter">
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
      </mat-form-field>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>

      <ng-container matColumnDef="itemNo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Item No </th>
        <td mat-cell *matCellDef="let element"> {{element.itemNo}} </td>
      </ng-container>
    
      <ng-container matColumnDef="itemName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Item Name </th>
        <td mat-cell *matCellDef="let element"> {{element.itemName}} </td>
      </ng-container>
    
      <ng-container matColumnDef="itemCategory">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Item Category </th>
        <td mat-cell *matCellDef="let element"> {{element.itemCategory}} </td>
      </ng-container>
    
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Action </th>
        <td mat-cell *matCellDef="let element"> 
          <button mat-icon-button color="warn" (click)="editData(element)" matTooltip="edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteData(element)" matTooltip="delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

     <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
