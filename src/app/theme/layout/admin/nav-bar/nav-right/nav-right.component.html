<ul class="navbar-nav">
  <li>
    <div class="dropdown" ngbDropdown placement="auto">
      <a ngbDropdownToggle href="javascript:" data-toggle="dropdown" (click)="togglePanel()">
        <i class="icon feather icon-bell"></i>
        <span class="badge bg-danger" *ngIf="service.unreadCount$ | async as unread">{{ unread }}</span>
      </a>
      <div ngbDropdownMenu class="dropdown-menu dropdown-menu-end notification">
        <div class="notification-head">
          <h6 class="d-inline-block m-b-0">Notifications</h6>
          <div class="float-end">
            <a href="javascript:" class="m-r-10 text-decoration-none" (click)="service.markAllRead()">mark as read</a>
            <a href="javascript:" class="text-decoration-none" (click)="service.clear()">clear all</a>
          </div>
        </div>
        <ul class="notification-body">
          <ng-container *ngIf="service.notifications$ | async as notifications">
            <li class="notification" *ngIf="notifications.length === 0">
            <div class="d-flex">
              <img class="img-radius" src="assets/images/user/avatar-2.jpg" alt="Generic placeholder image" />
              <div class="flex-grow-1">
                <p>
                  <strong>Nothing Yet</strong>
                  <span class="n-time text-muted">
                    <i class="icon feather icon-clock m-r-10"></i>
                    --
                  </span>
                </p>
                <p>Nothing to be shwon yet</p>
              </div>
            </div>
          </li>

          <li class="notification"  *ngFor="let n of notifications; trackBy: trackById" [class.unread]="!n.readStatus">
            <div class="d-flex">
              <img class="img-radius" src="assets/images/user/avatar-2.jpg" alt="Generic placeholder image" />
              <div class="flex-grow-1">
                <p>
                  <strong>{{n.title}}</strong>
                  <span class="n-time text-muted">
                    <i class="icon feather icon-clock m-r-10"></i>
                    10 min
                  </span>
                </p>
                <p>{{n.message}}</p>
              </div>
            </div>
          </li>
          </ng-container>
        </ul>
        <div class="notification-footer">
          <a href="javascript:">show all</a>
        </div>
      </div>
    </div>
  </li>
  <li>
    <div class="dropdown drp-user" ngbDropdown placement="auto">
      <a href="javascript:" ngbDropdownToggle data-toggle="dropdown">
        <i class="icon feather icon-settings"></i>
      </a>
      <div class="dropdown-menu dropdown-menu-end profile-notification" ngbDropdownMenu>
        <div class="pro-head">
          <img src="assets\images\user\logout.jpeg" class="img-radius" alt="User-Profile-Image" />
          <span>{{userName}}</span>
          <a href="javascript:" class="dud-logout" title="Logout" (click)="logOutUser()">
            <i class="feather icon-log-out"></i>
          </a>
        </div>
        <ul class="pro-body">

  </li>
