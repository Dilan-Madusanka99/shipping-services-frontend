<div class="container">
  <div class="form-section">
    <form [formGroup]="jobPostingForm" class="jobPostingForm" (ngSubmit)="onSubmit()">
    
    <h5>Job Vacancies</h5>
        <div class="form-field">
            <label for="image">Upload Image</label>
            <input type="file" (change)="onFileSelected($event)" accept="image/*"/>
        </div>
    
        <div *ngIf="previewUrl">
            <p>Image Preview:</p>
            <img [src]="previewUrl" alt="Image preview" width="200" />
        </div>
        <br>

        <!-- should be linked vessel name -->
        <!-- <mat-form-field class="example-full-width">
        <mat-label> Vessel Name </mat-label>
        <mat-select formControlName="vesselName">
          <mat-option value="AB Trainee">AB Trainee</mat-option>
        </mat-select>
      </mat-form-field>  
      <br> -->

          <mat-form-field class="example-full-width">
            <mat-label>Vessel Name</mat-label>
            <mat-select [(ngModel)]="selectedVessel" formControlName="vesselName" (valueChange)="onVesselSelect($event)">
              <mat-form-field class="w-100">
                <input matInput placeholder="Search for vessel..." (keyup)="onVesselKey($event.target)" />
          </mat-form-field>
            <mat-option *ngFor="let vessel of vesselDropdown" [value]="vessel.id">{{ vessel.vesselName }}</mat-option>
            </mat-select>
          </mat-form-field>
          <br />

        <mat-form-field class="example-full-width">
        <mat-label> Position </mat-label>
        <mat-select formControlName="position">
          <mat-option value="AB Trainee">AB Trainee</mat-option>
          <mat-option value="OS">OS</mat-option>
          <mat-option value="AB">AB</mat-option>
          <mat-option value="Bosun">Bosun</mat-option>
          <mat-option value="Pumpman">Pumpman</mat-option>
          <mat-option value="Oiler">Oiler</mat-option>
          <mat-option value="Fitter">Fitter</mat-option>
          <mat-option value="Messman">Messman</mat-option>
          <mat-option value="Cook">Cook</mat-option>
          <mat-option value="Electrician">Electrician</mat-option>
        </mat-select>
      </mat-form-field>  
      <br>

      <mat-form-field class="example-full-width">
        <mat-label> Job Status </mat-label>
        <mat-select formControlName="jobStatus">
          <mat-option value="Open">Open</mat-option>
          <mat-option value="Close">Close</mat-option>
        </mat-select>
      </mat-form-field>  
      <br>

        <mat-form-field class="example-full-width">
            <mat-label> Description </mat-label>
            <input matInput placeholder="Description" formControlName="jobDescription" >
        </mat-form-field>
        <br><br>

        <button type="submit" mat-raised-button color="primary" class="form-button" [disabled]="isButtonDisabled" > {{saveButtonLabel}} </button>
        <button type="reset" mat-raised-button color="secondary" class="form-button" (click)="resetData()" > Reset </button>
    </form>
  </div>    


<div class="table-section">
    <div class="refresh-filter-section">
      <div class="refresh-button">
        <button mat-raised-button color="primary" (click)="refreshData()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
      <mat-form-field class="filter">
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
      </mat-form-field>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>

      <ng-container matColumnDef="vesselName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Vessel </th>
        <td mat-cell *matCellDef="let element"> {{element.vesselName}} </td>
      </ng-container>

      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Position </th>
        <td mat-cell *matCellDef="let element"> {{element.position}} </td>
      </ng-container>

      <ng-container matColumnDef="jobStatus">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Job Status </th>
        <td mat-cell *matCellDef="let element"> {{element.jobStatus}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Action </th>
        <td mat-cell *matCellDef="let element"> 
          <button mat-icon-button color="warn" (click)="editData(element)" matTooltip="edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteData(element)" matTooltip="delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
</div>

</div>
