<div class="header">
  <h3>Standby Crew Details</h3>
  <!-- <i class="feather icon-user"></i> -->
</div>

<div class="container">
  <div class="form-section">
    <form [formGroup]="standbyCrewMembersForm" class="standbyCrewMembersForm" (ngSubmit)="onSubmit()">

      <mat-form-field appearance="outline" class="example-full-width">
        <mat-label>SID No</mat-label>
        <mat-select [(ngModel)]="selectedSeafarers" formControlName="sidNo" (valueChange)="onSeafarersSelect($event)">
          <mat-form-field class="w-100">
            <input matInput placeholder="Search for Seafarers..." (keyup)="onSeafarerKey($event.target)" />
          </mat-form-field>
          <mat-option *ngFor="let seafarers of seafarersDropdown" [value]="seafarers.id">{{ seafarers.sidNo }}</mat-option>
        </mat-select>
        <mat-error *ngIf="standbyCrewMembersForm.get('sidNo')?.hasError('required')"> SID No is required. </mat-error>
      </mat-form-field>

      <!-- <mat-form-field appearance="outline" class="example-full-width">
        <mat-label>Position</mat-label>
        <mat-select [(ngModel)]="selectedSeafarers" formControlName="position" (valueChange)="onSeafarersSelect($event)">
          <mat-option *ngFor="let seafarers of seafarersDropdown" [value]="seafarers.id">{{ seafarers.position }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="example-full-width">
        <mat-label>Surname</mat-label>
        <mat-select [(ngModel)]="selectedSeafarers" formControlName="surname" (valueChange)="onSeafarersSelect($event)">
          <mat-option *ngFor="let seafarers of seafarersDropdown" [value]="seafarers.id">{{ seafarers.surname }}</mat-option>
        </mat-select>
      </mat-form-field> -->

      <mat-form-field appearance="outline" class="example-full-width">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="Active">Active</mat-option>
          <mat-option value="Inactive">Inactive</mat-option>
        </mat-select>
        <mat-error *ngIf="standbyCrewMembersForm.get('status')?.hasError('required')"> Status is required. </mat-error>
      </mat-form-field>

      <button type="submit" mat-raised-button color="primary" class="form-button" [disabled]="isButtonDisabled">
        {{ saveButtonLabel }}
      </button>
      <button type="reset" mat-raised-button color="secondary" class="form-button" (click)="resetData()">Reset</button>
    </form>
  </div>
  <div class="table-section">
    <div class="refresh-filter-section">
      <div class="refresh-button">
        <button mat-raised-button color="primary" (click)="refreshData()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
      <mat-form-field appearance="outline" class="filter">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="applyFilter($event)" placeholder="Search" #input />
      </mat-form-field>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
      <ng-container matColumnDef="sidName">
        <th mat-header-cell *matHeaderCellDef [hidden]="true">SID No</th>
        <td mat-cell *matCellDef="let element">{{ element.sidNo }}</td>
      </ng-container>

      <ng-container matColumnDef="profileImage">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element">
          <img 
            [src]="'data:image/jpeg;base64,' + element.profileImage" class="avatar"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="sidNo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Sid No</th>
        <td mat-cell *matCellDef="let element">{{ element.sidNo }}</td>
      </ng-container>

      <ng-container matColumnDef="surname">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Surname</th>
        <td mat-cell *matCellDef="let element">{{ element.surname }}</td>
      </ng-container>

      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Position</th>
        <td mat-cell *matCellDef="let element">{{ element.position }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="warn" (click)="editData(element)" matTooltip="edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteData(element)" matTooltip="delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
