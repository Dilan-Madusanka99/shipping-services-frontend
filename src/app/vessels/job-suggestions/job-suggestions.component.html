<div class="header">
  <h3>Job Suggestions</h3>
</div>

<div class="container">
  <aside class="form-section">
    <form [formGroup]="jobSuggestionsForm" class="jobSuggestionsForm">
      <mat-form-field appearance="outline" class="example-full-width">
        <mat-label>Select Jobs</mat-label>
        <mat-select formControlName="selectedJob">
          <mat-option *ngFor="let job of jobSuggestions" [value]="job.value">
            {{ job.label }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="jobSuggestionsForm.get('selectedJob')?.hasError('required')">
          Please select a job
        </mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" class="button" (click)="getSelectedJob()">
        Get Job Suggestions
      </button>
    </form>
  </aside>

  <section class="results">
    <div class="results-grid">
      <div class="profile-card" *ngFor="let user of users">
        <div class="profile-header">
          <img
            class="avatar"
            [src]="user?.profileImage ? 'data:image/jpeg;base64,' + user.profileImage : 'assets/default-avatar.png'"
            [alt]="user.surname + ' avatar'"
          />
          <div class="user-info">
            <h4>{{ user.surname }}</h4>
            <p class="sidNo">{{ user.sidNo }}</p>
            <p class="position">{{ user.position }}</p>
            <p class="email">{{ user.email }}</p>
            <p class="mobile">{{ user.mobile }}</p>
          </div>
        </div>

        <div class="profile-footer">
          <button mat-stroked-button class="profile-button" (click)="openProfile(user)">
            View Profile
          </button>
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="!users?.length">
      <p>Select a job and click "Get Job Suggestions" to see matching candidates.</p>
    </div>
  </section>
</div>
