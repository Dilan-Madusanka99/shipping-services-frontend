<div class="header">
  <h3>Employee Attendences</h3>
  <!-- <i class="feather icon-user"></i> -->
</div>

<div class="container">
  <div class="form-section">
    <form [formGroup]="employeeAttendenceForm" class="employeeAttendenceForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="example-full-width">

        <mat-label>Users</mat-label>
        <mat-select [(ngModel)]="selectedEmployee" formControlName="users" (valueChange)="onEmployeeSelect($event)">
          <mat-form-field class="w-100">
            <input matInput placeholder="Search for employee..." (keyup)="onKey($event.target)" />
          </mat-form-field>
          <mat-option *ngFor="let emp of employeeDropdown" [value]="emp.id">{{ emp.name }}</mat-option>
        </mat-select>
        <mat-error *ngIf="employeeAttendenceForm.get('users')?.hasError('required')"> Username is required. </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="example-full-width">
        <mat-label>Attendence Status</mat-label>
        <mat-select formControlName="attendenceStatus">
          <mat-option value="Present">Present</mat-option>
          <mat-option value="Absent">Absent</mat-option>
        </mat-select>
          <mat-error *ngIf="employeeAttendenceForm.get('attendenceStatus')?.hasError('required')"> Status is required. </mat-error>
      </mat-form-field>

      <button type="submit" mat-raised-button color="primary" class="form-button" [disabled]="isButtonDisabled">
        {{ saveButtonLabel }}
      </button>
      <button type="reset" mat-raised-button color="secondary" class="form-button" (click)="resetData()">Reset</button>
    </form>
  </div>

  <div class="table-section">
    <div class="refresh-filter-section">
      <div class="refresh-button">
        <button mat-raised-button color="primary" (click)="refreshData()">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>

      <mat-form-field appearance="outline" class="filter">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="applyFilter($event)" placeholder="Search" #input />
      </mat-form-field>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
      <ng-container matColumnDef="attandenceDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
        <td mat-cell *matCellDef="let element">{{ element.attandenceDate | date: 'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>User Name</th>
        <td mat-cell *matCellDef="let element">{{ element.userName }}</td>
      </ng-container>

      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
        <td mat-cell *matCellDef="let element">{{ element.roles }}</td>
      </ng-container>

      <ng-container matColumnDef="attendenceStatus">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let element">{{ element.attendenceStatus }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let element">
          
          <button mat-icon-button color="warn" (click)="editData(element)" matTooltip="edit">
            <mat-icon>edit</mat-icon>
          </button>

          <!-- <button mat-icon-button color="warn" (click)="deleteData(element)" matTooltip="delete">
            <mat-icon>delete</mat-icon>
          </button> -->
          
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
